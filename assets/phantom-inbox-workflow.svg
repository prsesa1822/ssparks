<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-labelledby="title desc">
  <title id="title">Phantom Inbox n8n workflow proof</title>
  <desc id="desc">A dark n8n-style workflow showing Gmail trigger, message fetch, metadata extraction, Claude API request, AI response parsing, and routing into label or delete actions.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.4" fill="#2b3230"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <linearGradient id="greenLine" x1="0" x2="1">
      <stop offset="0" stop-color="#00a947"/>
      <stop offset="1" stop-color="#18c45f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#18c45f"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4a4f4d"/>
    </marker>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f3f5f4;font-weight:800;font-size:25px;text-anchor:middle}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#aeb7b0;font-size:17px;text-anchor:middle}
      .tiny{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#aeb7b0;font-size:17px}
      .node{fill:#2b2d2c;stroke:#08a84d;stroke-width:3.2;rx:10;filter:url(#shadow)}
      .node-gray{fill:#2b2d2c;stroke:#555b59;stroke-width:2.4;rx:10;filter:url(#shadow)}
      .port{fill:#3b3f3e;stroke:#666;stroke-width:2}
      .check{fill:#18c45f;font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:900;font-size:30px}
      .item{fill:#c8cec9;font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px}
    </style>
  </defs>
  <rect width="2048" height="1152" fill="#111514"/>
  <rect width="2048" height="1152" fill="url(#dots)" opacity="0.9"/>
  <text x="96" y="86" class="tiny" fill="#f3f5f4" style="font-size:28px;font-weight:800">Phantom Inbox workflow</text>
  <text x="96" y="122" class="tiny" style="fill:#18c45f;font-size:22px;font-weight:800">Workflow executed successfully</text>

  <g transform="translate(120 0)">
    <path d="M162 458 H 426" stroke="url(#greenLine)" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="298" y="439" class="item">1 item</text>
    <path d="M562 458 H 826" stroke="url(#greenLine)" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="692" y="439" class="item">1 item</text>
    <path d="M962 458 H 1226" stroke="url(#greenLine)" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="1092" y="439" class="item">1 item</text>
    <path d="M1362 458 H 1626" stroke="url(#greenLine)" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="1492" y="439" class="item">1 item</text>
    <path d="M1762 458 H 1894" stroke="url(#greenLine)" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <text x="1810" y="439" class="item">1 item</text>

    <g transform="translate(0 398)">
      <rect class="node" width="122" height="122" rx="10"/>
      <circle class="port" cx="122" cy="61" r="10"/>
      <text x="61" y="77" font-family="Inter,Segoe UI,Arial" font-size="48" font-weight="900" fill="#fff" text-anchor="middle">M</text>
      <text x="102" y="106" class="check">✓</text>
      <text x="61" y="158" class="label">Gmail Trigger</text>
      <text x="61" y="185" class="sub">Gmail Trigger</text>
    </g>

    <g transform="translate(400 398)">
      <circle class="port" cx="0" cy="61" r="10"/>
      <rect class="node" width="122" height="122" rx="10"/>
      <circle class="port" cx="122" cy="61" r="10"/>
      <text x="61" y="77" font-family="Inter,Segoe UI,Arial" font-size="48" font-weight="900" fill="#fff" text-anchor="middle">M</text>
      <text x="102" y="106" class="check">✓</text>
      <text x="61" y="158" class="label">Get a message</text>
      <text x="61" y="185" class="sub">get: message</text>
    </g>

    <g transform="translate(800 398)">
      <circle class="port" cx="0" cy="61" r="10"/>
      <rect class="node" width="122" height="122" rx="10"/>
      <circle class="port" cx="122" cy="61" r="10"/>
      <text x="61" y="77" font-family="Inter,Segoe UI,Arial" font-size="54" font-weight="700" fill="#8587ff" text-anchor="middle">✎</text>
      <text x="102" y="106" class="check">✓</text>
      <text x="61" y="158" class="label">Extract Email Metadata</text>
      <text x="61" y="185" class="sub">manual</text>
    </g>

    <g transform="translate(1200 398)">
      <circle class="port" cx="0" cy="61" r="10"/>
      <rect class="node" width="122" height="122" rx="10"/>
      <circle class="port" cx="122" cy="61" r="10"/>
      <text x="61" y="78" font-family="Inter,Segoe UI,Arial" font-size="62" fill="#8587ff" text-anchor="middle">◎</text>
      <text x="102" y="106" class="check">✓</text>
      <text x="61" y="158" class="label">HTTP Request</text>
      <text x="61" y="185" class="sub">POST: api.anthropic.com</text>
    </g>

    <g transform="translate(1600 398)">
      <circle class="port" cx="0" cy="61" r="10"/>
      <rect class="node" width="122" height="122" rx="10"/>
      <circle class="port" cx="122" cy="61" r="10"/>
      <text x="61" y="78" font-family="Georgia,serif" font-size="62" fill="#f3b35c" text-anchor="middle">{ }</text>
      <text x="102" y="106" class="check">✓</text>
      <text x="61" y="158" class="label">Parse AI Response</text>
    </g>

    <g transform="translate(1900 358)">
      <circle class="port" cx="0" cy="101" r="10"/>
      <rect class="node" width="122" height="162" rx="10"/>
      <circle class="port" cx="122" cy="61" r="10"/><circle class="port" cx="122" cy="101" r="10"/><circle class="port" cx="122" cy="141" r="10"/>
      <text x="61" y="101" font-family="Inter,Segoe UI,Arial" font-size="62" fill="#5ba8f7" text-anchor="middle">↬</text>
      <text x="102" y="146" class="check">✓</text>
      <text x="61" y="202" class="label">Route Email Action</text>
      <text x="61" y="229" class="sub">mode: Rules</text>
    </g>
  </g>

  <g transform="translate(1840 0)">
    <path d="M202 419 C 270 380, 330 336, 400 310" stroke="#4a4f4d" stroke-width="4" fill="none" marker-end="url(#arrowGray)"/>
    <path d="M202 459 C 270 459, 330 459, 400 459" stroke="#4a4f4d" stroke-width="4" fill="none" marker-end="url(#arrowGray)"/>
    <path d="M202 499 C 270 560, 330 658, 400 684" stroke="#4a4f4d" stroke-width="4" fill="none" marker-end="url(#arrowGray)"/>
  </g>

  <g transform="translate(1836 254)">
    <circle class="port" cx="0" cy="61" r="10"/>
    <rect class="node-gray" width="122" height="122" rx="10"/>
    <circle class="port" cx="122" cy="61" r="10"/>
    <text x="61" y="77" font-family="Inter,Segoe UI,Arial" font-size="48" font-weight="900" fill="#fff" text-anchor="middle">M</text>
    <text x="61" y="158" class="label">Add label to message</text>
    <text x="61" y="185" class="sub">addLabels: message</text>
  </g>
  <g transform="translate(1836 458)">
    <circle class="port" cx="0" cy="61" r="10"/>
    <rect class="node-gray" width="122" height="122" rx="10"/>
    <circle class="port" cx="122" cy="61" r="10"/>
    <text x="61" y="77" font-family="Inter,Segoe UI,Arial" font-size="48" font-weight="900" fill="#fff" text-anchor="middle">M</text>
    <text x="61" y="158" class="label">Add label to message</text>
    <text x="61" y="185" class="sub">addLabels: message</text>
  </g>
  <g transform="translate(1836 644)">
    <circle class="port" cx="0" cy="61" r="10"/>
    <rect class="node-gray" width="122" height="122" rx="10"/>
    <circle class="port" cx="122" cy="61" r="10"/>
    <text x="61" y="77" font-family="Inter,Segoe UI,Arial" font-size="48" font-weight="900" fill="#fff" text-anchor="middle">M</text>
    <text x="61" y="158" class="label">Delete a message</text>
    <text x="61" y="185" class="sub">delete: message</text>
  </g>

  <g transform="translate(1578 1038)">
    <rect width="452" height="91" rx="6" fill="#2b2d2c"/>
    <circle cx="35" cy="36" r="14" fill="#18c45f"/>
    <text x="35" y="44" font-family="Inter,Segoe UI,Arial" font-size="20" font-weight="900" text-anchor="middle" fill="#102016">✓</text>
    <text x="70" y="41" class="tiny" style="font-size:24px;fill:#f3f5f4;font-weight:900">Workflow executed</text>
    <text x="70" y="72" class="tiny" style="font-size:24px;fill:#f3f5f4;font-weight:900">successfully</text>
  </g>
</svg>
