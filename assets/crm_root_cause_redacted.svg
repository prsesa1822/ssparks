<svg xmlns="http://www.w3.org/2000/svg" width="1138" height="660" viewBox="0 0 1138 660"><rect width="1138" height="660" fill="#ffffff"/><text x="26" y="34" font-family="Segoe UI,Arial" font-size="22" fill="#637083">I found 883 records in the CRM Contact Portfolio and pulled the first 500; then fetched the remaining records so the sample was complete.</text><text x="54" y="108" font-family="Segoe UI,Arial" font-size="17" fill="#74879b">Queried HubSpot data and 1 more</text><text x="26" y="176" font-family="Segoe UI,Arial" font-size="22" fill="#637083">I've got the full 883-contact set now; many records were modified recently, so stale ownership needed to be tested instead of assumed.</text><text x="54" y="250" font-family="Segoe UI,Arial" font-size="17" fill="#74879b">Queried HubSpot data and 9 more</text><text x="26" y="322" font-family="Segoe UI,Arial" font-size="22" fill="#637083">Confirmed there are</text><text x="244" y="322" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#34495e"> no records with last modified dates older than 12 months,</text><text x="26" y="356" font-family="Segoe UI,Arial" font-size="22" fill="#637083">so the main issues are data completeness and consistency rather than stale records.</text><rect x="26" y="553" width="1088" height="86" rx="8" fill="#ffffff" stroke="#dce5ee"/><circle cx="72" cy="596" r="22" fill="#eef4f8"/><text x="108" y="594" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#34495e">CRM contact data quality review</text><text x="108" y="618" font-family="Segoe UI,Arial" font-size="17" fill="#637083">Document</text><text x="1082" y="594" font-family="Segoe UI,Arial" font-size="18" fill="#637083">v1</text></svg>
