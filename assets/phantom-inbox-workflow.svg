<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Phantom Inbox n8n workflow proof</title>
  <desc id="desc">A dark workflow diagram showing Gmail trigger, message retrieval, metadata extraction, Claude API request, AI response parsing, and routing to inbox label, Phantom Inbox label, or delete action.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#26302d"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#10b957"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#646c68"/>
    </marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#eef4f1;font-weight:900;font-size:24px}
      .success{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#19d267;font-weight:900;font-size:18px}
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f5f7f6;font-weight:900;font-size:16px;text-anchor:middle}
      .sub{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#b8c0bc;font-size:13px;text-anchor:middle}
      .item{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#cfd6d2;font-size:14px;text-anchor:middle}
      .node{fill:#2a2d2c;stroke:#08a84d;stroke-width:2.8;filter:url(#shadow)}
      .target{fill:#2a2d2c;stroke:#626965;stroke-width:2.2;filter:url(#shadow)}
      .port{fill:#3c4240;stroke:#707773;stroke-width:1.6}
      .check{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#18c45f;font-size:24px;font-weight:900}
      .icon{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#ffffff;font-size:36px;font-weight:900;text-anchor:middle}
      .code{font-family:Georgia,serif;fill:#f0b461;font-size:38px;text-anchor:middle}
      .route{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#65a8ff;font-size:40px;text-anchor:middle}
    </style>
  </defs>

  <rect width="1600" height="760" rx="12" fill="#101514"/>
  <rect width="1600" height="760" rx="12" fill="url(#dots)" opacity="0.95"/>
  <text x="72" y="66" class="title">Phantom Inbox workflow</text>
  <text x="72" y="96" class="success">Workflow executed successfully</text>

  <path d="M200 380 H330" stroke="#10b957" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="265" y="354" class="item">1 item</text>
  <path d="M450 380 H580" stroke="#10b957" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="515" y="354" class="item">1 item</text>
  <path d="M700 380 H830" stroke="#10b957" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="765" y="354" class="item">1 item</text>
  <path d="M950 380 H1080" stroke="#10b957" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="1015" y="354" class="item">1 item</text>
  <path d="M1200 380 H1282" stroke="#10b957" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="1238" y="354" class="item">1 item</text>

  <g transform="translate(110 320)">
    <rect class="node" width="90" height="90" rx="9"/>
    <circle class="port" cx="90" cy="45" r="8"/>
    <text x="45" y="58" class="icon">M</text>
    <text x="75" y="82" class="check">✓</text>
    <text x="45" y="126" class="label">Gmail Trigger</text>
    <text x="45" y="148" class="sub">Gmail Trigger</text>
  </g>

  <g transform="translate(360 320)">
    <circle class="port" cx="0" cy="45" r="8"/>
    <rect class="node" width="90" height="90" rx="9"/>
    <circle class="port" cx="90" cy="45" r="8"/>
    <text x="45" y="58" class="icon">M</text>
    <text x="75" y="82" class="check">✓</text>
    <text x="45" y="126" class="label">Get a message</text>
    <text x="45" y="148" class="sub">get: message</text>
  </g>

  <g transform="translate(610 320)">
    <circle class="port" cx="0" cy="45" r="8"/>
    <rect class="node" width="90" height="90" rx="9"/>
    <circle class="port" cx="90" cy="45" r="8"/>
    <text x="45" y="58" class="icon" style="fill:#898bff">✎</text>
    <text x="75" y="82" class="check">✓</text>
    <text x="45" y="126" class="label">Extract Metadata</text>
    <text x="45" y="148" class="sub">manual</text>
  </g>

  <g transform="translate(860 320)">
    <circle class="port" cx="0" cy="45" r="8"/>
    <rect class="node" width="90" height="90" rx="9"/>
    <circle class="port" cx="90" cy="45" r="8"/>
    <text x="45" y="60" class="icon" style="fill:#898bff">◎</text>
    <text x="75" y="82" class="check">✓</text>
    <text x="45" y="126" class="label">HTTP Request</text>
    <text x="45" y="148" class="sub">POST: Claude API</text>
  </g>

  <g transform="translate(1110 320)">
    <circle class="port" cx="0" cy="45" r="8"/>
    <rect class="node" width="90" height="90" rx="9"/>
    <circle class="port" cx="90" cy="45" r="8"/>
    <text x="45" y="58" class="code">{ }</text>
    <text x="75" y="82" class="check">✓</text>
    <text x="45" y="126" class="label">Parse AI Response</text>
  </g>

  <g transform="translate(1292 290)">
    <circle class="port" cx="0" cy="75" r="8"/>
    <rect class="node" width="90" height="150" rx="9"/>
    <circle class="port" cx="90" cy="35" r="8"/>
    <circle class="port" cx="90" cy="75" r="8"/>
    <circle class="port" cx="90" cy="115" r="8"/>
    <text x="45" y="88" class="route">↬</text>
    <text x="75" y="132" class="check">✓</text>
    <text x="45" y="188" class="label">Route Action</text>
    <text x="45" y="210" class="sub">mode: Rules</text>
  </g>

  <path d="M1382 325 C1420 290 1450 256 1484 228" stroke="#646c68" stroke-width="3.5" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M1382 365 H1484" stroke="#646c68" stroke-width="3.5" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M1382 405 C1420 446 1450 488 1484 526" stroke="#646c68" stroke-width="3.5" fill="none" marker-end="url(#arrowGray)"/>
  <text x="1406" y="312" class="item">0</text>
  <text x="1406" y="354" class="item">1</text>
  <text x="1406" y="396" class="item">2</text>

  <g transform="translate(1490 170)">
    <circle class="port" cx="0" cy="45" r="8"/>
    <rect class="target" width="82" height="82" rx="8"/>
    <circle class="port" cx="82" cy="45" r="8"/>
    <text x="41" y="55" class="icon" style="font-size:31px">M</text>
    <text x="41" y="116" class="label">Inbox Label</text>
    <text x="41" y="138" class="sub">addLabels</text>
  </g>

  <g transform="translate(1490 320)">
    <circle class="port" cx="0" cy="45" r="8"/>
    <rect class="target" width="82" height="82" rx="8"/>
    <circle class="port" cx="82" cy="45" r="8"/>
    <text x="41" y="55" class="icon" style="font-size:31px">M</text>
    <text x="41" y="116" class="label">Phantom Label</text>
    <text x="41" y="138" class="sub">addLabels</text>
  </g>

  <g transform="translate(1490 490)">
    <circle class="port" cx="0" cy="45" r="8"/>
    <rect class="target" width="82" height="82" rx="8"/>
    <circle class="port" cx="82" cy="45" r="8"/>
    <text x="41" y="55" class="icon" style="font-size:31px">M</text>
    <text x="41" y="116" class="label">Delete</text>
    <text x="41" y="138" class="sub">delete message</text>
  </g>

  <g transform="translate(1210 646)">
    <rect width="330" height="64" rx="6" fill="#2a2d2c"/>
    <circle cx="34" cy="32" r="13" fill="#19d267"/>
    <text x="34" y="39" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="900" text-anchor="middle" fill="#0f2017">✓</text>
    <text x="66" y="29" class="title" style="font-size:18px">Workflow executed</text>
    <text x="66" y="52" class="title" style="font-size:18px">successfully</text>
  </g>
</svg>
