<svg xmlns="http://www.w3.org/2000/svg" width="1106" height="622" viewBox="0 0 1106 622"><rect width="1106" height="622" fill="#ffffff"/><rect x="824" y="10" width="270" height="62" rx="22" fill="#f1f6fb" stroke="#dce5ee"/><text x="844" y="48" font-family="Segoe UI,Arial" font-size="22" fill="#40536a">Produce a cleanup plan</text><text x="6" y="176" font-family="Segoe UI,Arial" font-size="22" fill="#637083">I turned the data-quality findings into a practical cleanup plan with priorities, sequencing, and automation recommendations.</text><text x="6" y="488" font-family="Segoe UI,Arial" font-size="22" fill="#637083">The key recommendation is to stop</text><text x="348" y="488" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#34495e"> bad data at entry first,</text><text x="6" y="522" font-family="Segoe UI,Arial" font-size="22" fill="#637083">then clean the highest-impact fields, then consolidate duplicate properties.</text><rect x="4" y="532" width="1090" height="84" rx="8" fill="#ffffff" stroke="#dce5ee"/><circle cx="44" cy="574" r="22" fill="#eef4f8"/><text x="78" y="572" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#34495e">CRM contact cleanup plan</text><text x="78" y="596" font-family="Segoe UI,Arial" font-size="17" fill="#637083">Document</text><text x="1050" y="582" font-family="Segoe UI,Arial" font-size="18" fill="#637083">v2</text></svg>
