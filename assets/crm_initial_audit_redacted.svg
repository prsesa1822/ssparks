<svg xmlns="http://www.w3.org/2000/svg" width="1142" height="675" viewBox="0 0 1142 675"><rect width="1142" height="675" fill="#f7f9fc"/><rect x="84" y="10" width="1048" height="96" rx="22" fill="#f1f6fb" stroke="#dce5ee"/><text x="104" y="58" font-family="Segoe UI,Arial" font-size="25" fill="#40536a">Out of the contacts assigned to Record Owner, how many have missing phone numbers, emails, and addresses?</text><text x="8" y="184" font-family="Segoe UI,Arial" font-size="23" fill="#40536a">I'll check the assigned contact owner's records, then count how many are missing each field: phone number, email, and address.</text><text x="38" y="234" font-family="Segoe UI,Arial" font-size="17" fill="#74879b">Searched for owners and 2 more</text><text x="8" y="300" font-family="Segoe UI,Arial" font-size="23" fill="#40536a">Out of 883 contacts assigned to this owner:</text><text x="44" y="452" font-family="Segoe UI,Arial" font-size="23" fill="#40536a">•</text><text x="68" y="452" font-family="Segoe UI,Arial" font-size="23" font-weight="700" fill="#34495e">330</text><text x="123" y="452" font-family="Segoe UI,Arial" font-size="23" fill="#40536a"> are missing a phone number</text><text x="44" y="488" font-family="Segoe UI,Arial" font-size="23" fill="#40536a">•</text><text x="68" y="488" font-family="Segoe UI,Arial" font-size="23" font-weight="700" fill="#34495e">811</text><text x="123" y="488" font-family="Segoe UI,Arial" font-size="23" fill="#40536a"> are missing an email</text><text x="44" y="524" font-family="Segoe UI,Arial" font-size="23" fill="#40536a">•</text><text x="68" y="524" font-family="Segoe UI,Arial" font-size="23" font-weight="700" fill="#34495e">413</text><text x="123" y="524" font-family="Segoe UI,Arial" font-size="23" fill="#40536a"> are missing an address</text><text x="8" y="584" font-family="Segoe UI,Arial" font-size="22" fill="#637083">Caveat: address was counted using the main address field, so street/city/state/zip may need a separate pass.</text></svg>
